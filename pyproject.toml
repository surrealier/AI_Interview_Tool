[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-interviewer"
dynamic = ["version"]
description = "Offline-first Windows desktop app for AI interview practice: voice interviewing, rubric scoring, adaptive follow-ups, and a session report."
requires-python = ">=3.12"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.14",
    "pytest>=8.0",
]
cloud = [
    "anthropic>=1.0,<2",
]

[tool.setuptools]
packages = [
    "ai_interviewer",
    "ai_interviewer.intelligence",
    "ai_interviewer.intelligence.llm",
    "ai_interviewer.tts",
]

[tool.setuptools.dynamic]
version = {attr = "ai_interviewer.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
